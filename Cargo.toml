[workspace]
resolver = "2"
members = ["crates/core", "crates/ui"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Soumen"]
repository = "https://github.com/soumendrak/retirement-planner"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# IDs
uuid = { version = "1.11", features = ["v4", "serde"] }

# Platform directories
dirs = "5.0"

# Testing
proptest = "1.6"

# Error handling
thiserror = "2.0"
